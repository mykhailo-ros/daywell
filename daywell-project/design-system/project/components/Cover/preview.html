<!doctype html>
<html><head><meta charset="utf-8"><title>Daywell — cover</title>
<style>
html,body{margin:0;background:var(--bg)}
.cv{position:relative;width:960px;height:300px;background:var(--bg);overflow:hidden;font-family:var(--font-sans)}
.cv svg{position:absolute;inset:0}
.ink{fill:var(--ink)} .acc{fill:var(--accent)} .tint{fill:var(--accent-tint)} .surf{fill:var(--surface)}
.r-md{rx:var(--radius-md)} .r-lg{rx:var(--radius-lg)}
.dot-done{fill:var(--accent)} .dot-kept{fill:none;stroke:var(--accent);stroke-width:2} .kept-dash{stroke:var(--accent);stroke-width:2;stroke-linecap:round}
.name{position:absolute;left:48px;bottom:96px;margin:0;font-size:96px;line-height:.92;font-weight:600;letter-spacing:-2px;color:var(--ink);max-width:440px}
.tag{position:absolute;left:52px;bottom:52px;margin:0;font-size:14px;line-height:20px;color:var(--ink-2);max-width:420px}
</style></head>
<body><div class="cv">
<svg width="960" height="300" viewBox="0 0 960 300" aria-hidden="true">

       pattern: a literal motif — the check-in dot. "Done counts, Skip and Reschedule keep the streak" → filled dots and kept rings on a 32px (space-8) week grid
       steps/radii: space-8 pitch, space-4 dot radius x2, radius-lg on the accent block, radius-md on the surface tile -->

  <circle class="dot-done" cx="556" cy="172" r="8"/>

    <circle class="dot-done" cx="748" cy="204" r="8"/>
