n><span title="flame"><i class="ic ic-flame " style="width:24px;height:24px" aria-hidden="true"></i></span><span title="award"><i class="ic ic-award " style="width:24px;height:24px" aria-hidden="true"></i></span><span title="sunrise"><i class="ic ic-sunrise " style="width:24px;height:24px" aria-hidden="true"></i></span><span title="sun"><i class="ic ic-sun " style="width:24px;height:24px" aria-hidden="true"></i></span><span title="moon"><i class="ic ic-moon " style="width:24px;height:24px" aria-hidden="true"></i></span><span title="close"><i class="ic ic-close " style="width:24px;height:24px" aria-hidden="true"></i></span><span title="idea"><i class="ic ic-idea " style="width:24px;height:24px" aria-hidden="true"></i></span><span title="sliders"><i class="ic ic-sliders " style="width:24px;height:24px" aria-hidden="true"></i></span><span title="chart"><i class="ic ic-chart " style="width:24px;height:24px" aria-hidden="true"></i></span><span title="lock"><i class="ic ic-lock " style="width:24px;height:24px" aria-hidden="true"></i></span></div></div></div></div>
